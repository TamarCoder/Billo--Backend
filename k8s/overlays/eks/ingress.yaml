# Needs the AWS Load Balancer Controller installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billo-backend
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # TODO: ACM certificate ARN for the API domain
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERT_ARN
spec:
  ingressClassName: alb
  rules:
    - host: api.billo.example.com # TODO: real API domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: billo-backend
                port:
                  name: http
